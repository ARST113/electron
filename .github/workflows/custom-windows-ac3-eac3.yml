name: Custom Electron Windows AC3-EAC3

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/custom-windows-ac3-eac3.yml'

permissions:
  contents: read

concurrency:
  group: custom-electron-windows-ac3-eac3
  cancel-in-progress: false

env:
  ELECTRON_REVISION: v44.4.4
  BUILD_ROOT: 'C:\electron-build'
  DEPOT_TOOLS_WIN_TOOLCHAIN: '0'
  ELECTRON_DEPOT_TOOLS_WIN_TOOLCHAIN: '0'
  CI: '1'
  vs2022_install: 'C:\BuildTools'
  WINDOWSSDKDIR: 'C:\Program Files (x86)\Windows Kits\10'
  GN_EXTRA_ARGS: 'enable_platform_ac3_eac3_audio=true proprietary_codecs=true ffmpeg_branding="Chrome" override_electron_version="44.4.4" dcheck_always_on=false symbol_level=0 blink_symbol_level=0 v8_symbol_level=0'

jobs:
  build-windows-x64:
    name: Windows x64 AC3-EAC3 self-hosted
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 1440

    defaults:
      run:
        shell: cmd

    steps:
      - name: Verify self-hosted build machine
        shell: powershell
        run: |
          Write-Host "===== Machine ====="
          Get-CimInstance Win32_ComputerSystem | Select-Object Name,NumberOfLogicalProcessors,@{N='RAM_GB';E={[math]::Round($_.TotalPhysicalMemory/1GB,1)}} | Format-List
          Get-PSDrive -PSProvider FileSystem | Format-Table -AutoSize

          Write-Host "===== Toolchain ====="
          git --version
          node --version
          python --version

          $cl = Get-ChildItem 'C:\BuildTools\VC\Tools\MSVC\*\bin\Hostx64\x64\cl.exe' -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (!$cl) {
            throw 'MSVC x64 compiler not found under C:\BuildTools'
          }
          Write-Host "MSVC: $($cl.FullName)"

          $sdk = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Directory -ErrorAction SilentlyContinue |
            Where-Object Name -Match '^10\.' |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if (!$sdk) {
            throw 'Windows SDK not found'
          }
          Write-Host "Windows SDK: $($sdk.Name)"

          New-Item -ItemType Directory -Force -Path $env:BUILD_ROOT,'C:\electron-temp','C:\electron-go-cache' | Out-Null
          "TEMP=C:\electron-temp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=C:\electron-temp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GOCACHE=C:\electron-go-cache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          try {
            Add-MpPreference -ExclusionPath $env:BUILD_ROOT -ErrorAction Stop
            Write-Host "Windows Defender exclusion ensured for $env:BUILD_ROOT"
          } catch {
            Write-Warning "Could not change Defender exclusions: $($_.Exception.Message)"
          }

      - name: Ensure Windows SDK Debugging Tools
        shell: powershell
        timeout-minutes: 15
        run: |
          $debuggerFiles = @('dbghelp.dll', 'dbgcore.dll') | ForEach-Object {
            Join-Path $env:WINDOWSSDKDIR "Debuggers\x64\$_"
          }
          $missing = @($debuggerFiles | Where-Object { !(Test-Path -LiteralPath $_) })
          if ($missing.Count -gt 0) {
            Write-Host "Installing missing Windows SDK Debugging Tools: $($missing -join ', ')"
            $sdkEntry = Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
              Where-Object { $_.DisplayName -match 'Windows Software Development Kit.*10\.0\.26100' -and $_.BundleCachePath } |
              Sort-Object DisplayVersion -Descending |
              Select-Object -First 1
            $installer = $sdkEntry.BundleCachePath
            if (!$installer -or !(Test-Path -LiteralPath $installer)) {
              $installer = Join-Path $env:TEMP 'winsdksetup-26100.exe'
              Invoke-WebRequest -UseBasicParsing -Uri 'https://go.microsoft.com/fwlink/?linkid=2349110' -OutFile $installer
            }
            $signature = Get-AuthenticodeSignature -FilePath $installer
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
              throw "Windows SDK installer has an invalid Microsoft signature: $installer"
            }
            $installLog = Join-Path $env:TEMP 'windows-sdk-debuggers-install.log'
            $installArgs = @('/features', 'OptionId.WindowsDesktopDebuggers', '/quiet', '/norestart', '/log', ('"{0}"' -f $installLog))
            $process = Start-Process -FilePath $installer -ArgumentList $installArgs -WindowStyle Hidden -Wait -PassThru
            Write-Host "Windows SDK Debugging Tools installer exit code: $($process.ExitCode)"
            if ($process.ExitCode -notin @(0, 3010)) {
              if (Test-Path -LiteralPath $installLog) { Get-Content -LiteralPath $installLog -Tail 100 }
              throw "Windows SDK Debugging Tools installation failed: $($process.ExitCode)"
            }
          }
          foreach ($file in $debuggerFiles) {
            if (!(Test-Path -LiteralPath $file)) { throw "Required SDK debugger DLL missing: $file" }
            Get-Item -LiteralPath $file | Select-Object FullName,@{N='Version';E={$_.VersionInfo.FileVersion}} | Format-List
          }

      - name: Configure Git for Chromium checkout
        run: |
          git config --global core.filemode false
          git config --global core.autocrlf false
          git config --global branch.autosetuprebase always
          git config --global core.longpaths true
          git config --global core.fscache true
          git config --global core.preloadindex true

      - name: Install Electron build tools
        shell: powershell
        run: |
          npm install -g @electron/build-tools@2.1.5 --no-fund --no-audit

          $npmRoot = (npm root -g).Trim()
          $wrapper = Join-Path $npmRoot '@electron\build-tools\run.js'
          Write-Host "npm root: $npmRoot"
          Write-Host "build-tools wrapper: $wrapper"
          if (!(Test-Path $wrapper)) {
            throw "Could not find @electron/build-tools/run.js"
          }
          "BUILD_TOOLS_WRAPPER=$wrapper" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Select or initialize persistent Electron build
        run: |
          node "%BUILD_TOOLS_WRAPPER%" use ac3-fast || node "%BUILD_TOOLS_WRAPPER%" init ac3-fast --root "%BUILD_ROOT%" --import testing --out Release --target-cpu x64 --remote-build none --fork ARST113/electron --use-https
          node "%BUILD_TOOLS_WRAPPER%" show current

      - name: Verify local toolchain and preserved downloads
        shell: powershell
        run: |
          $overridesJson = & node $env:BUILD_TOOLS_WRAPPER show env --json
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect build-tools environment' }
          $overrides = ($overridesJson -join "`n") | ConvertFrom-Json
          $effectiveToolchain = $env:DEPOT_TOOLS_WIN_TOOLCHAIN
          if ($overrides.PSObject.Properties.Name -contains 'DEPOT_TOOLS_WIN_TOOLCHAIN') {
            $effectiveToolchain = $overrides.DEPOT_TOOLS_WIN_TOOLCHAIN
          }
          Write-Host "Effective DEPOT_TOOLS_WIN_TOOLCHAIN=$effectiveToolchain"
          if ($effectiveToolchain -ne '0') { throw 'build-tools is overriding the local Windows toolchain' }
          $paths = @(
            $env:BUILD_ROOT,
            (Join-Path $env:USERPROFILE '.git_cache'),
            (Join-Path $env:USERPROFILE '.electron_build_tools'),
            'C:\electron-go-cache'
          )
          foreach ($path in $paths) {
            if (Test-Path -LiteralPath $path) {
              $files = Get-ChildItem -LiteralPath $path -Recurse -Force -File -ErrorAction SilentlyContinue |
                Measure-Object -Property Length -Sum
              Write-Host ("Preserved {0}: {1:N2} GiB, {2} files" -f $path, ($files.Sum / 1GB), $files.Count)
            }
          }
          Get-PSDrive -PSProvider FileSystem | Format-Table -AutoSize

      - name: Sync Electron and Chromium sources
        run: |
          echo ===== Sync started %DATE% %TIME% =====
          node "%BUILD_TOOLS_WRAPPER%" sync --revision %ELECTRON_REVISION%
          if errorlevel 1 exit /b %errorlevel%
          echo ===== Sync finished %DATE% %TIME% =====

      - name: Show disk after sync
        shell: powershell
        run: |
          Get-PSDrive -PSProvider FileSystem | Format-Table -AutoSize
          if (Test-Path $env:BUILD_ROOT) {
            $bytes = (Get-ChildItem $env:BUILD_ROOT -Recurse -Force -File -ErrorAction SilentlyContinue |
              Measure-Object -Property Length -Sum).Sum
            Write-Host ("Persistent Electron tree: {0:N2} GB" -f ($bytes / 1GB))
          }

      - name: Generate GN config and build FFmpeg
        run: |
          node "%BUILD_TOOLS_WRAPPER%" build --no-remote --target third_party/ffmpeg:ffmpeg

      - name: Verify AC3-EAC3 and fast-build flags
        shell: powershell
        run: |
          $argsPath = Join-Path $env:BUILD_ROOT 'src\out\Release\args.gn'
          if (!(Test-Path $argsPath)) {
            throw "GN args file not found: $argsPath"
          }

          $gn = Get-Content $argsPath -Raw
          Write-Host '===== Effective relevant GN args ====='
          Get-Content $argsPath | Select-String 'enable_platform_ac3_eac3_audio|proprietary_codecs|ffmpeg_branding|is_official_build|symbol_level|dawn_enable_vulkan|dawn_use_swiftshader'

          $required = @(
            'enable_platform_ac3_eac3_audio\s*=\s*true',
            'proprietary_codecs\s*=\s*true',
            'ffmpeg_branding\s*=\s*"Chrome"',
            'symbol_level\s*=\s*0'
          )

          foreach ($pattern in $required) {
            if ($gn -notmatch $pattern) {
              throw "Required GN setting missing: $pattern"
            }
          }

      - name: Build Electron distribution
        run: |
          echo ===== Electron build started %DATE% %TIME% =====
          node "%BUILD_TOOLS_WRAPPER%" build --no-remote --target electron:electron_dist_zip
          if errorlevel 1 exit /b %errorlevel%
          echo ===== Electron build finished %DATE% %TIME% =====

      - name: Show disk after build
        if: always()
        shell: powershell
        run: |
          Get-PSDrive -PSProvider FileSystem | Format-Table -AutoSize

      - name: Prepare artifact
        shell: powershell
        run: |
          $source = Join-Path $env:BUILD_ROOT 'src\out\Release\dist.zip'
          if (!(Test-Path $source)) {
            Get-ChildItem (Join-Path $env:BUILD_ROOT 'src\out\Release') -Filter '*.zip' -Recurse -ErrorAction SilentlyContinue |
              Select-Object FullName,Length
            throw 'Electron dist.zip was not produced'
          }

          $dest = Join-Path $env:GITHUB_WORKSPACE 'electron-v44.4.4-win32-x64-ac3-eac3.zip'
          Copy-Item $source $dest -Force
          Get-Item $dest | Format-List Name,Length,FullName

      - name: Upload custom Electron
        uses: actions/upload-artifact@v4
        with:
          name: electron-v44.4.4-win32-x64-ac3-eac3
          path: electron-v44.4.4-win32-x64-ac3-eac3.zip
          compression-level: 0
          retention-days: 14
